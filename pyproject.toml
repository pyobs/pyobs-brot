[project]
name = "pyobs-brot"
version = "2.0.0.dev6"
description = "pyobs module for BROTlib telescopes"
authors = [{ name = "Tim-Oliver Husser", email = "thusser@uni-goettingen.de" }, { name = "Lukas Melzig", email = "lukas.melzig@stud.uni-goettingen.de" }]
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "astropy>=7.0.1,<8",
    "pyobs-core>=2.0.0.dev20,<3",
    "paho-mqtt>=2.1.0",
    "pybrotlib>=1.1.1",
]

[dependency-groups]
dev = [
    "black>=23.7.0,<24",
    "ruff>=0.9.0",
    "pyrefly>=1.1.1",
    "pre-commit>=3.3.3,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 120
target-version = ['py311']

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "G"]

[tool.pyrefly]
python-version = "3.11"
